<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Değirmenköy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --panel: rgba(22, 17, 12, 0.86); --panel-2: rgba(255, 240, 210, 0.05); --line: rgba(232, 214, 180, 0.14);
    --text: #efe4cf; --text-2: #bfae91; --text-3: #8a7a62; --gold: #d8a54a; --ember: #d06a3c;
    --serif: "Cormorant Garamond", Georgia, serif; --sans: "Source Sans 3", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #1a140e; color: var(--text); font-family: var(--sans); }
  canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: block; cursor: grab; touch-action: none; }
  canvas:active { cursor: grabbing; }

  .clock { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none;
    text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
  .clock .place { font-family: var(--serif); font-weight: 700; font-size: 26px; letter-spacing: 0.04em; color: #f6ead2; }
  .clock .time { font-family: var(--serif); font-style: italic; font-size: 19px; color: #e9d9b8; margin-top: 2px; }
  .clock .state { font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); margin-top: 6px; height: 14px; }

  .toggles { position: fixed; top: 16px; display: flex; gap: 8px; }
  .toggles.l { left: 16px; } .toggles.r { right: 16px; }
  .tbtn { font: 700 12px var(--sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); padding: 9px 14px; border-radius: 8px; cursor: pointer; backdrop-filter: blur(6px); }
  .tbtn:hover { border-color: rgba(216, 165, 74, 0.5); }
  .tbtn.on { color: var(--gold); border-color: rgba(216, 165, 74, 0.6); }
  .zoom { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 6px; z-index: 0; }
  .zoom button { width: 38px; height: 38px; font: 700 18px var(--sans); color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
  .zoom button:hover { border-color: rgba(216, 165, 74, 0.5); color: var(--gold); }
  .zoom button.fit { font-size: 11px; letter-spacing: 0.04em; }
  .tbtn kbd { font: 600 10px var(--sans); color: var(--text-3); margin-left: 6px; }

  .drawer { position: fixed; top: 62px; bottom: 16px; width: 380px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    backdrop-filter: blur(8px); display: flex; flex-direction: column; overflow: hidden; transition: transform .35s cubic-bezier(.3,.7,.2,1), opacity .35s; }
  .drawer.l { left: 16px; } .drawer.r { right: 16px; width: 340px; }
  .drawer.l.hidden { transform: translateX(calc(-100% - 24px)); opacity: 0; }
  .drawer.r.hidden { transform: translateX(calc(100% + 24px)); opacity: 0; }
  .drawer h2 { font-family: var(--serif); font-weight: 700; font-size: 22px; padding: 14px 18px 10px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 10px; }
  .drawer h2 small { font-family: var(--sans); font-weight: 600; font-size: 11px; letter-spacing: 0.1em; color: var(--text-3); text-transform: uppercase; }
  .scroll { flex: 1; overflow-y: auto; padding: 10px 14px 16px; }
  .scroll::-webkit-scrollbar { width: 6px; } .scroll::-webkit-scrollbar-thumb { background: rgba(232,214,180,0.15); border-radius: 3px; }

  .tur { margin-bottom: 16px; }
  .tur-h { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-3); padding: 6px 4px; display: flex; gap: 8px; align-items: center; }
  .tur-h::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .tur.now .tur-h { color: var(--gold); }
  .event { background: linear-gradient(90deg, rgba(208, 106, 60, 0.18), rgba(208,106,60,0.04)); border-left: 2px solid var(--ember); border-radius: 6px;
    padding: 9px 12px; margin: 6px 0 8px; font-family: var(--serif); font-size: 17px; line-height: 1.3; color: #f3e3c8; }
  .event b { display: block; font-family: var(--sans); font-size: 10.5px; letter-spacing: 0.14em; color: var(--ember); margin-bottom: 3px; }
  .convo { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 6px 0; }
  .convo-h { font-size: 12px; color: var(--text-2); margin-bottom: 7px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .convo-h .who { font-weight: 700; color: var(--text); }
  .convo-h .at { color: var(--text-3); }
  .line { display: grid; grid-template-columns: auto 1fr; gap: 8px; padding: 3px 0; font-size: 14.5px; line-height: 1.4; }
  .line .n { font-weight: 700; white-space: nowrap; }
  .line .m { color: #ece0c9; font-family: var(--serif); font-size: 17px; line-height: 1.25; }
  .line.miss .m { opacity: 0.5; }
  .line.miss .m::after { content: "  (duymadı)"; font-family: var(--sans); font-size: 11px; color: var(--text-3); }
  .alone { font-size: 13px; color: var(--text-3); font-style: italic; padding: 2px 4px; }
  .empty { font-family: var(--serif); font-style: italic; font-size: 18px; color: var(--text-3); padding: 30px 6px; text-align: center; }

  .char { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; overflow: hidden; cursor: pointer; background: var(--panel-2); transition: border-color .2s; }
  .char:hover { border-color: rgba(232,214,180,0.3); }
  .char.sel { border-color: rgba(216, 165, 74, 0.7); }
  .char-top { display: grid; grid-template-columns: 6px 1fr auto; gap: 10px; align-items: stretch; }
  .char-top .stripe { background: var(--c); }
  .char-main { padding: 9px 0 9px; }
  .char-main .nm { font-family: var(--serif); font-weight: 700; font-size: 20px; line-height: 1; }
  .char-main .rl { font-size: 11.5px; color: var(--text-3); margin-left: 6px; font-family: var(--sans); font-weight: 400; }
  .char-main .act { font-size: 13px; color: var(--text-2); margin-top: 5px; line-height: 1.35; }
  .char-side { padding: 9px 10px 9px 0; text-align: right; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
  .where { font-size: 11.5px; font-weight: 600; color: var(--text-2); }
  .mood { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; background: color-mix(in srgb, var(--m) 22%, transparent); color: var(--m); text-transform: lowercase; }
  .inner { font-family: var(--serif); font-style: italic; font-size: 16px; color: #e7d6b6; padding: 0 12px 10px 16px; line-height: 1.25; }
  .inner::before { content: "içinden: "; font-family: var(--sans); font-style: normal; font-size: 10.5px; letter-spacing: 0.08em; color: var(--text-3); text-transform: uppercase; }
  .detail { padding: 4px 12px 12px 16px; border-top: 1px dashed var(--line); }
  .detail h4 { font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-3); margin: 8px 0 6px; font-weight: 700; }
  .tr { display: grid; grid-template-columns: 90px 1fr 26px; gap: 8px; align-items: center; font-size: 12.5px; color: var(--text-2); padding: 2px 0; }
  .bar { height: 5px; background: rgba(255,255,255,0.06); border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 3px; }
  .tr b { font-weight: 600; font-size: 11px; color: var(--text-3); text-align: right; }
  .mem { font-size: 13px; color: var(--text-2); line-height: 1.35; padding: 3px 0; border-bottom: 1px dotted rgba(232,214,180,0.08); }
  .mem span { color: var(--text-3); font-size: 11px; margin-right: 6px; }
  .busy .where { color: var(--gold); animation: blink 1.1s infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  .foot { border-top: 1px solid var(--line); padding: 9px 16px; font-size: 11.5px; color: var(--text-3); display: flex; gap: 14px; }
  .foot b { color: var(--text-2); font-weight: 600; }
  @media (max-width: 900px) { .drawer { width: calc(100% - 32px) !important; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<canvas id="map"></canvas>

<div class="clock"><div class="place">Değirmenköy</div><div class="time" id="time">1. gün, sabah 08.00</div><div class="state" id="state"></div></div>
<div class="toggles l"><button class="tbtn on" id="tKonusma">Konuşmalar<kbd>K</kbd></button></div>
<div class="toggles r"><button class="tbtn on" id="tKarakter">Karakterler<kbd>C</kbd></button></div>

<div class="zoom"><button id="zIn" title="Yakınlaş">+</button><button id="zOut" title="Uzaklaş">−</button><button id="zFit" class="fit" title="Bütün harita">TÜM</button></div>
<aside class="drawer l" id="dKonusma"><h2>Konuşmalar <small id="konusmaSayi"></small></h2><div class="scroll" id="konusmalar"><div class="empty">Kasaba henüz uyanmadı.</div></div></aside>
<aside class="drawer r" id="dKarakter"><h2>Karakterler</h2><div class="scroll" id="karakterler"></div>
  <div class="foot"><span>Haiku çağrısı <b id="mCalls">0</b></span><span>Ort. tur <b id="mAvg">–</b></span></div></aside>

<script>
// ——— Yardımcılar ———
const $ = (id) => document.getElementById(id);
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const R = (a, b) => a + rnd() * (b - a);
const S = 2.4;                       // plan (1000×600) → dünya pikseli
const W = 1000 * S, H = 600 * S;
const P = (x, y) => ({ x: x * S, y: y * S });
const VAKIT = (h) => h < 11 ? "sabah" : h < 15 ? "öğle" : h < 18 ? "ikindi" : "akşam";
const RUH = [[/tedirgin|gergin|korku|endişe|kaygı|huzursuz|öfke|sinir|kızgın/, "#e0874a"], [/üzgün|hüzün|yorgun|kırgın|yalnız/, "#9a8fd0"],
  [/neşeli|mutlu|umutlu|heyecan|keyif|sevinç/, "#8cc56b"], [/sakin|huzurlu|rahat|dingin/, "#6fb0d6"], [/merak|şüphe|düşünceli|dikkat/, "#d8c25a"]];
const ruhRengi = (r = "") => (RUH.find(([re]) => re.test(r.toLocaleLowerCase("tr"))) || [0, "#b9ab92"])[1];

// ——— Dokular ———
const DOKU = ["aerial_grass_rock", "sparse_grass", "dry_mud_field_001", "withered_grass", "aerial_mud_1", "cobblestone_floor_05", "clay_roof_tiles_02", "forest_leaves_02", "aerial_rocks_02"];
const img = {};
const yukle = () => Promise.all(DOKU.map((d) => new Promise((ok) => { const i = new Image(); i.onload = () => { img[d] = i; ok(); }; i.onerror = ok; i.src = `/ekran/doku/${d}.jpg`; })));

// ——— Arazi (bir kez çizilir) ———
const arazi = document.createElement("canvas"); arazi.width = W; arazi.height = H;
const evler = [];   // gece pencere ışıkları için
let mekan = {};

function desen(c, ad, olcek, aci = 0) {
  const p = c.createPattern(img[ad], "repeat"); if (!p) return "#6b7a4a";
  p.setTransform(new DOMMatrix().rotate(aci).scale(olcek)); return p;
}

function araziCiz(s) {
  const c = arazi.getContext("2d");
  for (const [id, m] of Object.entries(s.mekanlar)) mekan[id] = P(m.x, m.y);
  const M = mekan;

  // Zemin: havadan çimen, üstüne seyrek çimen ve renk lekeleri
  c.fillStyle = desen(c, "aerial_grass_rock", 0.9); c.fillRect(0, 0, W, H);
  c.globalAlpha = 0.45; c.fillStyle = desen(c, "sparse_grass", 0.5, 20); c.fillRect(0, 0, W, H); c.globalAlpha = 1;
  c.globalCompositeOperation = "multiply"; c.fillStyle = "rgba(150, 170, 110, 0.55)"; c.fillRect(0, 0, W, H);
  for (let i = 0; i < 70; i++) {
    const x = R(0, W), y = R(0, H), r = R(80, 260), g = c.createRadialGradient(x, y, 0, x, y, r);
    const ton = rnd() < 0.5 ? "70, 90, 40" : "190, 170, 110";
    g.addColorStop(0, `rgba(${ton}, ${R(0.12, 0.25)})`); g.addColorStop(1, `rgba(${ton}, 0)`); c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2);
  }
  c.globalCompositeOperation = "source-over";

  // Tarlalar: kasaba dışında, sürülmüş çizgili parseller
  const tarla = (x, y, w, h, a, ad) => {
    c.save(); c.translate(x, y); c.rotate(a);
    c.fillStyle = desen(c, ad, 0.45); c.fillRect(-w / 2, -h / 2, w, h);
    c.globalCompositeOperation = "multiply"; c.fillStyle = ad === "withered_grass" ? "rgba(170, 160, 90, 0.85)" : "rgba(185, 140, 85, 0.8)"; c.fillRect(-w / 2, -h / 2, w, h); c.globalCompositeOperation = "source-over";
    c.globalAlpha = 0.18; c.strokeStyle = "#3b2c1a"; c.lineWidth = 3;
    for (let k = -h / 2; k < h / 2; k += 11) { c.beginPath(); c.moveTo(-w / 2, k); c.lineTo(w / 2, k); c.stroke(); }
    c.globalAlpha = 1; c.strokeStyle = "rgba(40, 55, 25, 0.75)"; c.lineWidth = 7; c.setLineDash([2, 9]); c.lineCap = "round"; c.strokeRect(-w / 2, -h / 2, w, h); c.setLineDash([]);
    c.restore();
  };
  [[160, 1250, 300, 190, 0.08, "dry_mud_field_001"], [470, 1310, 250, 170, -0.05, "withered_grass"], [1950, 1250, 330, 200, -0.1, "dry_mud_field_001"],
   [2250, 1050, 220, 260, 0.12, "withered_grass"], [1500, 1330, 260, 140, 0.03, "withered_grass"], [2230, 620, 200, 170, -0.2, "dry_mud_field_001"],
   [620, 130, 260, 150, 0.1, "withered_grass"]].forEach((t) => tarla(...t));

  // Dere: batıdan güneye kıvrılır
  const dere = [[-40, 160], [230, 300], [330, 640], [250, 980], [330, 1220], [260, 1480]];
  const dereYolu = () => { c.beginPath(); c.moveTo(...dere[0]); for (let i = 1; i < dere.length - 1; i++) { const [x, y] = dere[i], [nx, ny] = dere[i + 1]; c.quadraticCurveTo(x, y, (x + nx) / 2, (y + ny) / 2); } c.lineTo(...dere[dere.length - 1]); };
  c.lineCap = "round"; c.lineJoin = "round";
  dereYolu(); c.strokeStyle = "rgba(60, 70, 40, 0.8)"; c.lineWidth = 46; c.stroke();
  dereYolu(); c.strokeStyle = "#3f6470"; c.lineWidth = 30; c.stroke();
  dereYolu(); c.strokeStyle = "rgba(140, 185, 195, 0.55)"; c.lineWidth = 12; c.stroke();
  dereYolu(); c.strokeStyle = "rgba(230, 245, 245, 0.25)"; c.lineWidth = 3; c.stroke();

  // Değirmen tepesi
  const t = M.degirmen, tg = c.createRadialGradient(t.x - 60, t.y - 70, 20, t.x, t.y, 360);
  tg.addColorStop(0, "rgba(255, 245, 210, 0.28)"); tg.addColorStop(0.55, "rgba(255, 240, 200, 0.06)"); tg.addColorStop(1, "rgba(30, 40, 20, 0)");
  c.fillStyle = tg; c.beginPath(); c.ellipse(t.x, t.y, 360, 300, 0, 0, Math.PI * 2); c.fill();
  c.globalCompositeOperation = "multiply"; const ts = c.createRadialGradient(t.x + 120, t.y + 140, 40, t.x + 60, t.y + 80, 380);
  ts.addColorStop(0, "rgba(60, 60, 40, 0.5)"); ts.addColorStop(1, "rgba(255,255,255,0)"); c.fillStyle = ts; c.fillRect(t.x - 400, t.y - 400, 800, 800);
  c.globalCompositeOperation = "source-over";

  // Yollar: meydandan her mekana ve kasaba dışına
  const yollar = Object.entries(M).filter(([id]) => id !== "meydan").map(([id, p]) => ({ id, a: M.meydan, b: p }));
  yollar.push({ id: "dis1", a: M.meydan, b: P(1040, 330) }, { id: "dis2", a: M.meydan, b: P(-40, 420) }, { id: "dis3", a: M.bakkal, b: P(560, 640) });
  const kontrol = (a, b, id) => ({ x: (a.x + b.x) / 2 + (id === "degirmen" ? 160 : (b.y - a.y) * 0.12), y: (a.y + b.y) / 2 + (id === "degirmen" ? 90 : (a.x - b.x) * 0.08) });
  window.yolKontrol = {};
  for (const y of yollar) {
    const k = kontrol(y.a, y.b, y.id); yolKontrol[y.id] = k;
    const genis = y.id === "degirmen" ? 0.6 : y.id.startsWith("dis") ? 0.9 : 1;
    const ciz = () => { c.beginPath(); c.moveTo(y.a.x, y.a.y); c.quadraticCurveTo(k.x, k.y, y.b.x, y.b.y); };
    ciz(); c.strokeStyle = "rgba(70, 55, 35, 0.5)"; c.lineWidth = 34 * genis; c.stroke();
    ciz(); c.strokeStyle = y.id === "degirmen" ? "#9a8a62" : "#a78a5e"; c.lineWidth = 25 * genis; c.stroke();
    c.globalAlpha = 0.55; ciz(); c.strokeStyle = desen(c, y.id === "degirmen" ? "withered_grass" : "dry_mud_field_001", 0.3); c.lineWidth = 25 * genis; c.stroke(); c.globalAlpha = 1;
    ciz(); c.strokeStyle = "rgba(235, 215, 170, 0.22)"; c.lineWidth = 9 * genis; c.stroke();
  }
  // Meydan: parke taşı
  const m = M.meydan;
  c.save(); c.beginPath(); c.arc(m.x, m.y, 100, 0, Math.PI * 2); c.fillStyle = "rgba(60,45,30,0.5)"; c.fill();
  c.beginPath(); c.arc(m.x, m.y, 92, 0, Math.PI * 2); c.fillStyle = desen(c, "cobblestone_floor_05", 0.18); c.fill();
  c.fillStyle = "rgba(230, 210, 170, 0.12)"; c.fill(); c.restore();

  // Yanık değirmen çevresi
  c.save(); c.globalCompositeOperation = "multiply";
  const yg = c.createRadialGradient(t.x, t.y, 10, t.x, t.y, 120); yg.addColorStop(0, "rgba(40, 32, 26, 0.9)"); yg.addColorStop(1, "rgba(120, 110, 90, 0)");
  c.fillStyle = yg; c.beginPath(); c.arc(t.x, t.y, 120, 0, Math.PI * 2); c.fill(); c.restore();
  c.globalAlpha = 0.5; c.fillStyle = desen(c, "aerial_rocks_02", 0.25); c.beginPath(); c.arc(t.x, t.y, 70, 0, Math.PI * 2); c.fill(); c.globalAlpha = 1;

  // Binalar (yollardan sonra)
  const yolaYakin = (x, y, pay) => Object.values(M).some((p) => Math.hypot(p.x - x, p.y - y) < pay);
  binalar(c, M);
  // Ormanlar ve tek ağaçlar
  const orman = (cx, cy, rx, ry, n) => { for (let i = 0; i < n; i++) { const a = R(0, Math.PI * 2), d = Math.sqrt(rnd()); const x = cx + Math.cos(a) * rx * d, y = cy + Math.sin(a) * ry * d; if (!yolaYakin(x, y, 170)) agac(c, x, y, R(16, 30)); } };
  orman(120, 80, 260, 120, 70); orman(1500, 70, 330, 90, 70); orman(2350, 300, 130, 260, 60); orman(1100, 1420, 380, 70, 60); orman(70, 820, 70, 260, 40);
  orman(2380, 1400, 160, 80, 35); orman(1800, 900, 120, 70, 14);
  for (let i = 0; i < 40; i++) { const x = R(150, W - 150), y = R(120, H - 120); if (!yolaYakin(x, y, 190)) agac(c, x, y, R(14, 22)); }
  agac(c, m.x - 54, m.y - 40, 46); // meydandaki çınar

  // Kenar karartısı (harita hissi)
  const v = c.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, W * 0.62);
  v.addColorStop(0, "rgba(20, 14, 8, 0)"); v.addColorStop(1, "rgba(20, 14, 8, 0.55)"); c.fillStyle = v; c.fillRect(0, 0, W, H);
}

function agac(c, x, y, r) {
  c.save();
  c.fillStyle = "rgba(15, 20, 8, 0.38)"; c.beginPath(); c.ellipse(x + r * 0.45, y + r * 0.38, r * 1.02, r * 0.9, 0, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fillStyle = desen(c, "forest_leaves_02", 0.12 + r / 400, r * 7); c.fill();
  c.globalCompositeOperation = "multiply"; c.fillStyle = "rgba(85, 125, 50, 0.85)"; c.fill();
  c.globalCompositeOperation = "source-over";
  const g = c.createRadialGradient(x - r * 0.4, y - r * 0.45, r * 0.1, x, y, r * 1.05);
  g.addColorStop(0, "rgba(220, 240, 160, 0.35)"); g.addColorStop(0.6, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(10, 20, 5, 0.45)");
  c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
  c.restore();
}

// Tepeden bina: gölge, iki yüzlü kiremit çatı, mahya, baca
function ev(c, x, y, w, h, a, o = {}) {
  c.save(); c.translate(x, y); c.rotate(a);
  c.fillStyle = "rgba(10, 8, 4, 0.42)"; c.filter = "blur(4px)"; c.fillRect(-w / 2 + 9, -h / 2 + 8, w, h); c.filter = "none";

}

// Anlatıcı olayının yeri: nabız atan halka
function olayHalkasi(zaman) {
  const ev = akis.filter((e) => e.tip === "anlatici").pop();
  if (!ev || ev.gun !== durum.gun || ev.tur < durum.tur) return;
  const p = mekan[ev.yer] || mekan.meydan, t = (zaman % 2.4) / 2.4;
  cx.strokeStyle = `rgba(240, 150, 80, ${0.9 * (1 - t)})`; cx.lineWidth = 4; cx.beginPath(); cx.arc(p.x, p.y, 40 + t * 120, 0, 7); cx.stroke();
}

let onceki = performance.now();
function dongu(simdi) {
  const dt = Math.min(0.05, (simdi - onceki) / 1000); onceki = simdi; const zaman = simdi / 1000;
  saatGoster += (saatHedef - saatGoster) * Math.min(1, dt * 0.6);
  for (const k of Object.values(kisi)) if (k.yol && k.t < 1) {
    k.t = Math.min(1, k.t + dt / 4.5); const n = k.yol.length - 1, f = k.t * n, i = Math.min(n - 1, Math.floor(f)), u = f - i;
    const a = k.yol[i], b = k.yol[i + 1]; k.x = a.x + (b.x - a.x) * u; k.y = a.y + (b.y - a.y) * u; if (k.t >= 1) k.yol = null;
  }
  const c = cx; c.setTransform(1, 0, 0, 1, 0, 0); c.fillStyle = "#1a140e"; c.fillRect(0, 0, cv.width, cv.height);
  if (cizildi) {
    const d = devicePixelRatio; c.setTransform(cam.z * d, 0, 0, cam.z * d, (innerWidth / 2 - cam.x * cam.z) * d, (innerHeight / 2 - cam.y * cam.z) * d);
    c.drawImage(arazi, 0, 0); isik(); dumanCiz(dt); olayHalkasi(zaman); mekanAdlari();
    const sira = Object.entries(durum.sakinler).sort((a, b) => (kisi[a[0]]?.y ?? 0) - (kisi[b[0]]?.y ?? 0));
    for (const [id, r] of sira) if (kisi[id]) kisiCiz(id, r, kisi[id], zaman);
  }
  requestAnimationFrame(dongu);
}

function tikla(sx, sy) {
  const p = ekranDunya(sx, sy); let en = null, d = 40 / cam.z * zFit;
  for (const [id, k] of Object.entries(kisi)) { const m = Math.hypot(k.x - p.x, k.y - 20 - p.y); if (m < d) { d = m; en = id; } }
  secili = en === secili ? null : en; karakterler(); if (secili) { $("dKarakter").classList.remove("hidden"); $("tKarakter").classList.add("on"); }
}

// ——— Paneller ———
const ad = (id) => durum.sakinler[id]?.ad ?? id;
function konusmalar() {
  const turlar = new Map();
  for (const e of akis) { const k = `${e.gun}-${e.tur}`; if (!turlar.has(k)) turlar.set(k, { gun: e.gun, saat: e.saat, tur: e.tur, olay: [], soz: [] }); const t = turlar.get(k); if (e.tip === "anlatici") t.olay.push(e); if (e.tip === "soz") t.soz.push(e); }
  const liste = [...turlar.values()].reverse();
  let html = durum.durum === "dusunuyor" ? `<div class="tur now"><div class="tur-h">${durum.gun}. gün, ${durum.saat.replace(":", ".")}</div><div class="alone">Sakinler karar veriyor…</div></div>` : "";
  let sayi = 0;
  for (const t of liste) {
    if (!t.olay.length && !t.soz.length) continue;
    // Aynı yerde konuşanlar bir sohbet
    const gruplar = {};
    for (const s of t.soz) (gruplar[s.yer] ||= []).push(s);
    html += `<div class="tur"><div class="tur-h">${t.gun}. gün, ${VAKIT(parseInt(t.saat))} ${t.saat.replace(":", ".")}</div>`;
    for (const o of t.olay) html += `<div class="event"><b>KASABADA${o.yer !== "herkes" ? ", " + (durum.mekanlar[o.yer]?.ad ?? "").toLocaleUpperCase("tr") : ""}</b>${o.metin}</div>`;
    for (const [yer, sozler] of Object.entries(gruplar)) {
      const kisiler = [...new Set(sozler.flatMap((s) => [s.kim, ...(s.duyanlar || []), ...(s.kime && s.kime !== "herkes" ? [s.kime] : [])]))].filter((id) => durum.sakinler[id]);
      const baslik = kisiler.length > 1 ? kisiler.slice(0, -1).map(ad).join(", ") + " ile " + ad(kisiler.at(-1)) : ad(kisiler[0]) + " kendi kendine";
      html += `<div class="convo"><div class="convo-h"><span class="who">${baslik}</span><span class="at">${durum.mekanlar[yer]?.ad ?? ""}</span></div>`;
      for (const s of sozler) { sayi++; html += `<div class="line${s.ulasmadi ? " miss" : ""}"><span class="n" style="color:${durum.sakinler[s.kim]?.renk}">${ad(s.kim)}:</span><span class="m">${s.metin}</span></div>`; }
      html += `</div>`;
    }
    html += `</div>`;
  }
  $("konusmalar").innerHTML = html || '<div class="empty">Kasaba henüz uyanmadı.</div>';
  $("konusmaSayi").textContent = sayi ? `${sayi} replik` : "";
}

const hafizalar = {};
async function hafizaGetir(id) {
  try { const t = await (await fetch(`/dunya/sakinler/${id}.md`, { cache: "no-store" })).text();
    hafizalar[id] = (t.split("## Hafıza")[1] || "").split("\n").filter((l) => l.startsWith("- ")).map((l) => l.slice(2)).reverse().slice(0, 8); } catch { hafizalar[id] = []; }
  karakterler();
}
function karakterler() {
  const busy = durum.durum === "dusunuyor";
  $("karakterler").innerHTML = Object.entries(durum.sakinler).map(([id, r]) => {
    const sec = secili === id; if (sec && !hafizalar[id]) hafizaGetir(id);
    return `<div class="char${sec ? " sel" : ""}${busy ? " busy" : ""}" data-id="${id}" style="--c:${r.renk}">
      <div class="char-top"><span class="stripe"></span>
        <div class="char-main"><span class="nm">${r.ad}</span><span class="rl">${r.unvan}, ${r.yas}</span><div class="act">${r.eylem}</div></div>
        <div class="char-side"><span class="where">${busy ? "karar veriyor" : durum.mekanlar[r.yer].ad}</span><span class="mood" style="--m:${ruhRengi(r.ruh)}">${r.ruh}</span></div>
      </div>
      ${r.ic_ses ? `<div class="inner">${r.ic_ses}</div>` : ""}
      ${sec ? `<div class="detail"><h4>Kime ne kadar güveniyor</h4>${Object.entries(r.guven).map(([o, v]) => `<div class="tr"><span>${ad(o)}</span><div class="bar"><i style="width:${v}%;background:${durum.sakinler[o].renk}"></i></div><b>${v}</b></div>`).join("")}
        <h4>Hafızası</h4>${(hafizalar[id] || []).map((m) => { const [z, ...g] = m.split(": "); return `<div class="mem"><span>${z}</span>${g.join(": ")}</div>`; }).join("") || '<div class="mem">Henüz bir şey hatırlamıyor.</div>'}</div>` : ""}
    </div>`;
  }).join("");
  document.querySelectorAll(".char").forEach((el) => el.onclick = () => { secili = secili === el.dataset.id ? null : el.dataset.id; if (secili) delete hafizalar[secili]; karakterler();
    if (secili) { const k = kisi[secili]; cam.z = Math.max(cam.z, zMin * 1.8); cam.x = k.x; cam.y = k.y; sinirla(); } });
  const t = olcum.filter((o) => o.sure_sn != null);
  $("mCalls").textContent = olcum.reduce((a, o) => a + (o.cevap || 0), 0);
  $("mAvg").textContent = t.length ? Math.round(t.reduce((a, o) => a + o.sure_sn, 0) / t.length) + " sn" : "–";
}

function cekmece(btn, dr) { $(btn).onclick = () => { $(dr).classList.toggle("hidden"); $(btn).classList.toggle("on"); }; }
cekmece("tKonusma", "dKonusma"); cekmece("tKarakter", "dKarakter");
addEventListener("keydown", (e) => { if (e.target.tagName === "INPUT") return; if (e.key === "k" || e.key === "K") $("tKonusma").click(); if (e.key === "c" || e.key === "C") $("tKarakter").click(); });

// ——— Veri ———
const jsonl = (t) => t.trim().split("\n").filter(Boolean).map((l) => { try { return JSON.parse(l); } catch { return null; } }).filter(Boolean);
let anahtar = "";
async function cek() {
  try {
    const [s, a, o] = await Promise.all([fetch("/dunya/kasaba.json", { cache: "no-store" }).then((r) => r.json()),
      fetch("/dunya/akis.jsonl", { cache: "no-store" }).then((r) => r.ok ? r.text() : ""), fetch("/dunya/olcum.jsonl", { cache: "no-store" }).then((r) => r.ok ? r.text() : "")]);
    const yeni = JSON.stringify(s) + a.length; if (yeni === anahtar) return; anahtar = yeni;
    durum = s; akis = jsonl(a); olcum = jsonl(o);
    if (!cizildi) { araziCiz(s); cizildi = true; }
    const h = parseInt(s.saat); saatHedef = s.durum === "gun_bitti" ? 20.5 : h;
    $("time").textContent = s.durum === "gun_bitti" ? `${s.gun - 1}. gün bitti` : `${s.gun}. gün, ${VAKIT(h)} ${s.saat.replace(":", ".")}`;
    $("state").textContent = s.durum === "dusunuyor" ? "sakinler karar veriyor" : "";
    yerlestir(s); for (const id of Object.keys(hafizalar)) delete hafizalar[id]; konusmalar(); karakterler();
  } catch (e) { $("state").textContent = "sunucuya ulaşılamıyor"; }
}
yukle().then(() => { boyut(); cek(); setInterval(cek, 2000); requestAnimationFrame(dongu); });
</script>
